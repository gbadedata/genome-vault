name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, test and build the warehouse on the real slice
    runs-on: ubuntu-latest
    env:
      GV_PARQUET: ${{ github.workspace }}/data/work/parquet
      GV_DUCKDB: ${{ github.workspace }}/data/work/genome_vault.duckdb
      GV_GNOMAD_CSV: ${{ github.workspace }}/tests/fixtures/real/gnomad_v3_chr22_42049000_42251000.csv
      DBT_PROFILES_DIR: ${{ github.workspace }}/warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --select E,F,W,B,UP,I --ignore E501 src scripts tests
      - name: Unit tests (loader on the real slice)
        run: pytest -m unit
      - name: Load the real slice
        run: |
          genome-vault load \
            --kgp-vcf tests/fixtures/real/kgp_chr22_42050k_42250k.vcf.gz \
            --clinvar tests/fixtures/real/clinvar_22_42050k_42250k.vcf.gz \
            --genes tests/fixtures/real/ensembl_genes_22_42050k_42250k.gff3.gz \
            --samples tests/fixtures/real/20130606_g1k_3202_samples_ped_population.txt \
            --unrelated-panel tests/fixtures/real/integrated_call_samples_v3.20130502.ALL.panel \
            --reference tests/fixtures/real/grch38_chr22_42050k_42250k.fa \
            --out data/work/parquet
      - name: Build and test the warehouse (dbt on DuckDB)
        working-directory: warehouse
        run: dbt build --target local
      - name: Show the QC summary
        working-directory: warehouse
        run: dbt show --inline "select kind, check_name, passed, detail from {{ ref('qc_summary') }}" --limit 50

  bigquery-sql:
    name: Compile the warehouse for BigQuery and parse it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install "dbt-bigquery>=1.8,<2.0" "sqlglot>=25"
      - name: Compile for BigQuery (offline profile, no credentials)
        working-directory: warehouse
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/warehouse/ci
        run: dbt compile --target bigquery --no-populate-cache --target-path target-bq
      - name: Parse every compiled file as BigQuery SQL
        run: python scripts/check_bigquery_sql.py warehouse/target-bq/compiled

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false -input=false
      - run: terraform validate
