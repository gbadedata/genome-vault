# =============================================================================
# pyproject.toml
# =============================================================================
# Single source of truth for: build, dependencies, dev tooling, test config.

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
[project]
name = "genome-vault"
version = "0.1.0"
description = "Genomic variant warehouse built from real 1000 Genomes, ClinVar, Ensembl and gnomAD data: BigQuery and dbt on Google Cloud, DuckDB locally."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Gbade Odimayo" },
]
keywords = ["bioinformatics", "genomics", "bigquery", "dbt", "gcp", "1000-genomes", "clinvar", "gnomad"]

dependencies = [
  "click >= 8.1,<9.0",
  "cyvcf2 >= 0.31,<1.0",      # fast genotype arrays for 3,202-sample VCFs
  "numpy >= 1.26",
  "pyarrow >= 15.0",
  "pysam >= 0.22,<1.0",       # slicing and indexing in scripts/fetch_sources.py
  "requests >= 2.31,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest >= 8.2,<9.0",
  "pytest-cov >= 5.0,<7.0",
  "ruff >= 0.5,<1.0",
  "duckdb >= 1.1",
  "dbt-duckdb >= 1.8,<2.0",
]
cloud = [
  "google-cloud-bigquery >= 3.21,<4.0",
  "google-cloud-storage >= 2.16,<4.0",
  "dbt-bigquery >= 1.8,<2.0",
]
api = [
  "fastapi >= 0.110",
  "uvicorn >= 0.29",
]

[project.scripts]
genome-vault = "genome_vault.cli:main"

[project.urls]
Homepage = "https://github.com/gbadedata/genome-vault"
Repository = "https://github.com/gbadedata/genome-vault"
Issues = "https://github.com/gbadedata/genome-vault/issues"

# -----------------------------------------------------------------------------
# Hatchling — where the source tree lives
# -----------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/genome_vault"]

# -----------------------------------------------------------------------------
# Ruff — linter + formatter
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle errors/warnings
  "F",          # pyflakes
  "I",          # isort
  "B",          # bugbear
  "C4",         # comprehensions
  "UP",         # pyupgrade
  "N",          # naming
  "S",          # bandit (security)
  "RUF",        # ruff-specific
  "PT",         # pytest style
  "SIM",        # simplification
  "TID",        # tidy imports
]
ignore = [
  "E501",       # line length handled by formatter
  "S101",       # asserts are fine in tests
  "S603",       # subprocess without shell=True is fine
  "B008",       # function call in default arg is fine for FastAPI/Click
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S", "PT011"]
"scripts/**/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["genome_vault"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# -----------------------------------------------------------------------------
# Mypy — strict type checking
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = [
  "build/",
  "dist/",
  ".venv/",
  ".terraform/",
]

[[tool.mypy.overrides]]
module = [
  "pysam.*",
  "cyvcf2.*",
  "pyarrow.*",
]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=genome_vault",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=80",
  "-v",
]
markers = [
  "unit: fast in-process tests (no I/O, no network)",
  "integration: tests requiring GCP credentials or external services",
  "slow: tests >5 seconds",
]

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/genome_vault"]
branch = true
omit = [
  "*/__init__.py",
  "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
