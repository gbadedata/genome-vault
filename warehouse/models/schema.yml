version: 2

models:
  - name: dim_sample
    description: Samples in VCF order with pedigree, population and the phase 3 unrelated flag.
    columns:
      - name: sample_index
        data_tests: [unique, not_null]
      - name: sample_id
        data_tests: [unique, not_null]
      - name: superpopulation
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['AFR', 'AMR', 'EAS', 'EUR', 'SAS']}

  - name: dim_variant
    description: One row per loaded variant, with overlapping Ensembl genes and ClinVar.
    columns:
      - name: variant_key
        data_tests: [unique, not_null]
      - name: variant_id
        data_tests: [unique, not_null]
      - name: variant_class
        data_tests:
          - accepted_values:
              arguments: {values: ['SNV', 'MNV', 'INDEL', 'SV']}
      - name: ref_check
        data_tests:
          - accepted_values:
              arguments: {values: ['match', 'unchecked']}

  - name: fct_genotype
    description: Sparse genotypes (non-reference or missing calls).
    columns:
      - name: variant_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_variant'), field: variant_key}
      - name: sample_index
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_sample'), field: sample_index}
      - name: gt
        data_tests:
          - accepted_values:
              arguments: {values: [1, 2, -1], quote: false}

  - name: variant_population_freq
    columns:
      - name: af
        data_tests: [not_null]

  - name: qc_hardy_weinberg
    description: Exact HWE test per variant and superpopulation (all samples, and unrelated samples).
    columns:
      - name: hwe_p_unrel
        data_tests: [not_null]

  - name: variant_context
    description: GIAB difficult-region flags and one region class per variant.
    columns:
      - name: variant_key
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments: {to: ref('dim_variant'), field: variant_key}
      - name: region_class
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['segmental_duplication', 'low_mappability', 'tandem_repeat_or_homopolymer', 'other_difficult', 'not_difficult']

  - name: findings_by_region_class
    description: Rate of each QC finding per region class, relative to not-difficult regions.

  - name: api_variant
    description: Serving table for the API, one row per variant; clustered by chrom and pos on BigQuery.
    columns:
      - name: variant_id
        data_tests: [unique, not_null]
      - name: variant_key
        data_tests: [unique, not_null]

  - name: api_rsid
    columns:
      - name: rsid
        data_tests: [not_null]
      - name: variant_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('api_variant'), field: variant_id}

  - name: api_gene
    columns:
      - name: gene_id
        data_tests: [unique, not_null]

  - name: qc_summary
    description: Invariants (must pass) and findings, one row per check.
