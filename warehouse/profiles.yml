# Used with DBT_PROFILES_DIR=warehouse (the Makefile sets it).
genome_vault:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('GV_DUCKDB', '../data/work/genome_vault.duckdb') }}"
      threads: 4
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('GV_PROJECT_ID', 'genome-vault-202605') }}"
      dataset: gv
      location: US          # gnomAD's public dataset is in US; BigQuery cannot join across locations
      threads: 4
      priority: interactive
      maximum_bytes_billed: 20000000000   # refuse any single query that would scan more than 20 GB
      job_execution_timeout_seconds: 1800
